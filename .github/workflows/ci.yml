name: Continuous Integration

on:
  pull_request:
    branches: ['main', 'develop']
  push:
    branches: ['main']

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build solution
        run: dotnet build --no-restore --configuration Release

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            src/**/bin/Release/**
            src/**/obj/Release/**
          retention-days: 1

  test:
    name: Test
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Restore local tools
        run: dotnet tool restore

      - name: Run API tests (PostgreSQL 16 via Testcontainers)
        run: |
          dotnet test tests/Taskify.Api.Tests \
            --configuration Release \
            --logger trx \
            --collect:"XPlat Code Coverage" \
            --settings coverage.runsettings \
            --results-directory ./test-results

      - name: Run Web tests
        run: |
          dotnet test tests/Taskify.Web.Tests \
            --configuration Release \
            --logger trx \
            --collect:"XPlat Code Coverage" \
            --settings coverage.runsettings \
            --results-directory ./test-results

      - name: Publish test results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: test-results/**/*.trx

      - name: Merge coverage reports
        run: |
          dotnet reportgenerator \
            -reports:"test-results/**/coverage.opencover.xml" \
            -targetdir:coverage \
            -reporttypes:"JsonSummary;MarkdownSummaryGithub"

      - name: Enforce 80% overall line coverage
        run: |
          coverage=$(jq -r '.summary.linecoverage' coverage/Summary.json)
          echo "Line coverage: ${coverage}%"
          cat coverage/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"
          if awk -v c="$coverage" 'BEGIN { exit !(c < 80) }'; then
            echo "::error::Line coverage ${coverage}% is below the 80% gate."
            exit 1
          fi

      - name: Merge critical-path coverage (Identity, Services, Endpoints)
        run: |
          dotnet reportgenerator \
            -reports:"test-results/**/coverage.opencover.xml" \
            -targetdir:coverage-critical \
            -reporttypes:"JsonSummary;MarkdownSummaryGithub" \
            -assemblyfilters:"+Taskify.Api" \
            -classfilters:"+Taskify.Api.Identity.*;+Taskify.Api.Services.*;+Taskify.Api.Endpoints.*"

      - name: Enforce 95% critical-path line coverage
        run: |
          coverage=$(jq -r '.summary.linecoverage' coverage-critical/Summary.json)
          echo "Critical-path line coverage: ${coverage}%"
          cat coverage-critical/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"
          if awk -v c="$coverage" 'BEGIN { exit !(c < 95) }'; then
            echo "::error::Critical-path line coverage ${coverage}% is below the 95% gate."
            exit 1
          fi

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: always()
        with:
          directory: ./test-results
          flags: unittests
          fail_ci_if_error: false

  docker-build:
    name: Build container images
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build API image
        run: docker build -f src/Taskify.Api/Dockerfile -t taskify-api:ci .

      - name: Build Web image
        run: docker build -f src/Taskify.Web/Dockerfile -t taskify-web:ci .

  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Run dotnet format
        run: dotnet format --verify-no-changes --verbosity diagnostic

  validate-bicep:
    name: Validate Bicep Templates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify Azure CLI
        run: az version

      - name: Validate main Bicep template
        run: |
          echo "Building and validating main.bicep..."
          az bicep build --file infra/main.bicep
          
      - name: Lint main Bicep template
        run: |
          echo "Linting main.bicep for best practices..."
          az bicep lint --file infra/main.bicep || true

      - name: Validate monitoring module
        run: az bicep build --file infra/resources/monitoring.bicep

      - name: Validate keyvault module
        run: az bicep build --file infra/resources/keyvault.bicep

      - name: Validate postgresql module
        run: az bicep build --file infra/resources/postgresql.bicep

      - name: Validate container-apps module
        run: az bicep build --file infra/resources/container-apps.bicep

      - name: Validate redis module
        run: az bicep build --file infra/resources/redis.bicep
