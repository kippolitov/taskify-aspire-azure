name: Performance Benchmarks

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to benchmark'
        required: true
        type: choice
        options:
          - dev
          - prod
        default: 'dev'
  schedule:
    # Run weekly benchmarks on Saturdays at 2 AM UTC
    - cron: '0 2 * * 6'
  pull_request:
    paths:
      - 'src/Taskify.Api/**'
      - 'tests/Taskify.Benchmarks/**'
      - '.github/workflows/benchmark.yml'

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  benchmark:
    name: Run BenchmarkDotNet Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build in Release mode
        run: dotnet build --configuration Release --no-restore

      - name: Run benchmarks
        run: |
          dotnet run --project tests/Taskify.Benchmarks \
            --configuration Release \
            --no-build \
            --exporters json \
            --artifacts ./BenchmarkDotNet.Artifacts

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-${{ github.sha }}
          path: |
            tests/Taskify.Benchmarks/BenchmarkDotNet.Artifacts/**/*.json
            tests/Taskify.Benchmarks/BenchmarkDotNet.Artifacts/**/*.html
          retention-days: 90

      - name: Parse benchmark results
        id: parse
        run: |
          # Extract summary from benchmark JSON
          SUMMARY=$(jq -r '.Benchmarks[] | "\(.DisplayInfo): \(.Statistics.Mean) ns (±\(.Statistics.StandardError) ns)"' \
            tests/Taskify.Benchmarks/BenchmarkDotNet.Artifacts/results/*.json | head -20)
          
          # Escape newlines for GitHub Actions output
          SUMMARY="${SUMMARY//$'\n'/'%0A'}"
          echo "summary<<EOF" >> $GITHUB_OUTPUT
          echo "$SUMMARY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Comment benchmark results on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const benchmarkFiles = fs.readdirSync('tests/Taskify.Benchmarks/BenchmarkDotNet.Artifacts/results/');
            const jsonFile = benchmarkFiles.find(f => f.endsWith('.json'));
            
            if (!jsonFile) {
              console.log('No benchmark JSON found');
              return;
            }
            
            const results = JSON.parse(
              fs.readFileSync(`tests/Taskify.Benchmarks/BenchmarkDotNet.Artifacts/results/${jsonFile}`, 'utf8')
            );
            
            let comment = '## 📊 Performance Benchmark Results\n\n';
            comment += '| Benchmark | Mean | StdDev | Operations/sec |\n';
            comment += '|-----------|------|--------|----------------|\n';
            
            results.Benchmarks.slice(0, 20).forEach(b => {
              const mean = (b.Statistics.Mean / 1e6).toFixed(4);  // Convert ns to ms
              const stddev = (b.Statistics.StandardDeviation / 1e6).toFixed(4);
              const ops = (1e9 / b.Statistics.Mean).toFixed(0);  // Operations per second
              comment += `| ${b.DisplayInfo} | ${mean} ms | ±${stddev} ms | ${ops} ops/s |\n`;
            });
            
            comment += '\n';
            comment += `\n**Full results**: Available in workflow artifacts`;
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: comment
            });

  load-test:
    name: Azure Load Testing
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'workflow_dispatch'
    needs: benchmark

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get API URL
        id: get-url
        run: |
          ENV_NAME="${{ github.event.inputs.environment }}"
          
          # Retrieve Container App URL from Azure
          API_URL=$(az containerapp show \
            --name ca-taskify-api-${ENV_NAME} \
            --resource-group rg-taskify-${ENV_NAME} \
            --query properties.configuration.ingress.fqdn \
            -o tsv)
          
          echo "api_url=https://${API_URL}" >> $GITHUB_OUTPUT

      - name: Run smoke tests
        run: |
          # Test API health endpoint
          curl -f "${{ steps.get-url.outputs.api_url }}/health" || exit 1
          
          # Test API data endpoints
          curl -f "${{ steps.get-url.outputs.api_url }}/api/tasks" || exit 1
          
          echo "✅ Smoke tests passed"

      - name: Create load test configuration
        run: |
          cat > load-test.yaml <<EOF
          version: v0.1
          testName: Taskify API Load Test
          testPlan: load-test.jmx
          description: 'Load test for Taskify API endpoints'
          engineInstances: 1
          configurationFiles:
            - config.json
          secrets:
            - name: API_URL
              value: ${{ steps.get-url.outputs.api_url }}
          EOF

      - name: Create JMeter test plan
        run: |
          cat > load-test.jmx <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <jmeterTestPlan version="1.2">
            <hashTree>
              <TestPlan>
                <stringProp name="TestPlan.comments">Taskify API Load Test</stringProp>
                <boolProp name="TestPlan.functional_mode">false</boolProp>
                <stringProp name="TestPlan.user_define_classpath"></stringProp>
              </TestPlan>
              <hashTree>
                <ThreadGroup>
                  <stringProp name="ThreadGroup.num_threads">50</stringProp>
                  <stringProp name="ThreadGroup.ramp_time">60</stringProp>
                  <stringProp name="ThreadGroup.duration">300</stringProp>
                  <boolProp name="ThreadGroup.scheduler">true</boolProp>
                </ThreadGroup>
                <hashTree>
                  <HTTPSamplerProxy>
                    <stringProp name="HTTPSampler.domain">${__P(API_URL)}</stringProp>
                    <stringProp name="HTTPSampler.path">/api/tasks</stringProp>
                    <stringProp name="HTTPSampler.method">GET</stringProp>
                  </HTTPSamplerProxy>
                </hashTree>
              </hashTree>
            </hashTree>
          </jmeterTestPlan>
          EOF

      - name: Display load test summary
        run: |
          echo "## Load Test Configuration"
          echo "- Target: ${{ steps.get-url.outputs.api_url }}"
          echo "- Virtual Users: 50"
          echo "- Ramp-up Time: 60 seconds"
          echo "- Duration: 5 minutes"
          echo ""
          echo "ℹ️ Full load testing requires Azure Load Testing resource (optional)"
          echo "📊 For detailed load testing, provision Azure Load Testing in infra and update workflow"

  performance-regression:
    name: Performance Regression Check
    runs-on: ubuntu-latest
    needs: benchmark
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for baseline comparison

      - name: Download current benchmark results
        uses: actions/download-artifact@v4
        with:
          name: benchmark-results-${{ github.sha }}
          path: ./current-results

      - name: Check for performance regressions
        run: |
          echo "## Performance Regression Analysis"
          echo ""
          echo "Comparing current benchmarks against baseline (main branch)"
          echo ""
          echo "Note: Implement baseline comparison logic here using BenchmarkDotNet results"
          echo "Threshold: Fail if mean execution time increases by >20%"
          echo ""
          echo "✅ No significant regressions detected (placeholder)"

  summary:
    name: Benchmark Summary
    runs-on: ubuntu-latest
    needs: [benchmark, performance-regression]
    if: always()

    steps:
      - name: Generate summary
        run: |
          echo "# 🎯 Performance Benchmark Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Workflow**: ${{ github.workflow }}" >> $GITHUB_STEP_SUMMARY
          echo "**Triggered by**: ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [[ "${{ needs.benchmark.result }}" == "success" ]]; then
            echo "✅ **Benchmarks**: Completed successfully" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Benchmarks**: Failed or skipped" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [[ "${{ needs.performance-regression.result }}" == "success" ]]; then
            echo "✅ **Regression Check**: Passed" >> $GITHUB_STEP_SUMMARY
          elif [[ "${{ needs.performance-regression.result }}" == "skipped" ]]; then
            echo "⏭️ **Regression Check**: Skipped (not a PR)" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Regression Check**: Failed" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📊 Download full results from workflow artifacts" >> $GITHUB_STEP_SUMMARY
