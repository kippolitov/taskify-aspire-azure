name: Azure Deployment

on:
  push:
    branches: ['main']
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prod

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  deploy-to-azure:
    name: Deploy to Azure
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment == 'prod' && 'production' || '' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Azure Developer CLI
        run: curl -fsSL https://aka.ms/install-azd.sh | bash

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Azure Developer CLI Login (OIDC)
        run: |
          azd auth login \
            --client-id ${{ secrets.AZURE_CLIENT_ID }} \
            --tenant-id ${{ secrets.AZURE_TENANT_ID }} \
            --federated-credential-provider "github"
        env:
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Configure azd environment
        run: |
          ENV_NAME="${{ inputs.environment || 'dev' }}"
          echo "Configuring azd environment: $ENV_NAME"
          
          # Select or create environment
          azd env select $ENV_NAME || azd env new $ENV_NAME
          
          # Set Azure subscription, location, and resource group
          azd env set AZURE_SUBSCRIPTION_ID ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          azd env set AZURE_LOCATION eastus2
          azd config set defaults.subscription ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          azd config set defaults.location eastus2
          
          # Use existing resource group
          azd env set AZURE_RESOURCE_GROUP "rg-${ENV_NAME}"
          
          # Set required Bicep parameters
          azd env config set infra.parameters.environmentName "$ENV_NAME"
          azd env config set infra.parameters.postgresqlAdminPassword "${{ secrets.POSTGRESQL_ADMIN_PASSWORD }}"
          
          # Copy environment-specific parameter file if it exists
          # azd automatically uses infra/main.parameters.json
          if [ -f "infra/main.parameters.$ENV_NAME.json" ]; then
            echo "Using environment-specific parameters from: infra/main.parameters.$ENV_NAME.json"
            cp "infra/main.parameters.$ENV_NAME.json" "infra/main.parameters.json"
          else
            echo "No environment-specific parameter file found, using defaults"
          fi
        env:
          AZURE_ENV_NAME: ${{ inputs.environment || 'dev' }}

      - name: Provision infrastructure
        run: azd provision --no-prompt
        env:
          AZURE_ENV_NAME: ${{ inputs.environment || 'dev' }}

      - name: Get database connection string
        id: db-connection
        run: |
          echo "Retrieving PostgreSQL connection string from azd outputs..."
          
          # Try to get connection string from azd output
          CONNECTION_STRING=$(azd env get-values --output json | jq -r '.POSTGRESQL_CONNECTION_STRING // empty')
          
          if [ -z "$CONNECTION_STRING" ]; then
            echo "Connection string not in azd outputs, constructing from server FQDN..."
            
            # Get PostgreSQL server FQDN from azd outputs
            PG_FQDN=$(azd env get-values --output json | jq -r '.postgresqlServerFqdn // empty')
            
            if [ -z "$PG_FQDN" ]; then
              echo "Server FQDN not found, querying Azure..."
              # Find the PostgreSQL server in the resource group
              ENV_NAME="${{ inputs.environment || 'dev' }}"
              PG_FQDN=$(az postgres flexible-server list \
                --resource-group "rg-${ENV_NAME}" \
                --query "[?starts_with(name, 'psql-taskify-')].fullyQualifiedDomainName" \
                -o tsv | head -n 1)
            fi
            
            if [ -z "$PG_FQDN" ]; then
              echo "Error: Could not find PostgreSQL server"
              exit 1
            fi
            
            echo "Using PostgreSQL server: $PG_FQDN"
            CONNECTION_STRING="Host=${PG_FQDN};Database=taskify;Username=taskifyadmin;Password=${{ secrets.POSTGRESQL_ADMIN_PASSWORD }};SSL Mode=Require;Trust Server Certificate=true"
          else
            # Extract hostname from connection string for logging (without password)
            PG_HOST=$(echo "$CONNECTION_STRING" | grep -oP 'Host=\K[^;]+' || echo "unknown")
            echo "Using PostgreSQL server: $PG_HOST"
          fi
          
          echo "::add-mask::$CONNECTION_STRING"
          echo "connection-string=$CONNECTION_STRING" >> $GITHUB_OUTPUT

      - name: Run database migrations
        run: |
          echo "Running EF Core migrations..."
          
          # Wait a moment for DNS propagation after provisioning
          sleep 5
          
          dotnet run --project src/Taskify.Migrator
        env:
          ConnectionStrings__DefaultConnection: ${{ steps.db-connection.outputs.connection-string }}

      - name: Deploy applications
        run: azd deploy --no-prompt
        env:
          AZURE_ENV_NAME: ${{ inputs.environment || 'dev' }}

      - name: Get deployment URLs
        id: deployment-urls
        run: |
          echo "Retrieving deployment URLs..."
          API_URL=$(azd env get-values --output json | jq -r '.SERVICE_API_ENDPOINT_URL // empty')
          WEB_URL=$(azd env get-values --output json | jq -r '.SERVICE_WEB_ENDPOINT_URL // empty')
          
          if [ -z "$API_URL" ] || [ -z "$WEB_URL" ]; then
            echo "Warning: Deployment URLs not found in azd outputs"
            echo "Trying alternative output names..."
            API_URL=$(azd env get-values --output json | jq -r '.taskifyApiUrl // empty')
            WEB_URL=$(azd env get-values --output json | jq -r '.taskifyWebUrl // empty')
          fi
          
          if [ -z "$API_URL" ] || [ -z "$WEB_URL" ]; then
            echo "Warning: Deployment URLs still not found. Check Azure Portal."
          else
            # Do not print endpoints to the public run log; pass them via step outputs only.
            echo "Deployment URLs retrieved successfully (see Azure Portal for endpoints)."
          fi
          
          echo "api-url=$API_URL" >> $GITHUB_OUTPUT
          echo "web-url=$WEB_URL" >> $GITHUB_OUTPUT

      - name: Run smoke tests
        run: bash infra/hooks/postdeploy.sh
        env:
          TASKIFY_API_URL: ${{ steps.deployment-urls.outputs.api-url }}
          TASKIFY_WEB_URL: ${{ steps.deployment-urls.outputs.web-url }}

      - name: Publish deployment summary
        if: always()
        run: |
          # Note: this summary is publicly visible on a public repo.
          # Deployment endpoints and the subscription ID are intentionally omitted;
          # retrieve them from the Azure Portal or `azd env get-values`.
          echo "## 🚀 Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment**: \`${{ inputs.environment || 'dev' }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Location**: \`eastus2\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ✅ Deployment completed successfully" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "_Endpoints omitted from the public log — see the Azure Portal for service URLs._" >> $GITHUB_STEP_SUMMARY
